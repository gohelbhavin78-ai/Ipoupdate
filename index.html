<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IPO Update | Bhavin Gohel</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</head>

<body>

<header>

<div class="container header">

<div class="logo">

<img id="businessLogo" src="images/logo.png">

</div>

<div>

<h1 id="businessName"></h1>

<p id="businessTagline"></p>

</div>

</div>

</header>


<section class="services">

<div class="container">

<div class="service">IPO</div>

<div class="service">Mutual Fund</div>

<div class="service">Health Insurance</div>

<div class="service">Life Insurance</div>

<div class="service">General Insurance</div>

</div>

</section>



<div class="container">

<div id="ipoCard">


<div class="company">

<img id="companyLogo" src="images/company.png">

<div>

<h2 id="companyName"></h2>

<p id="ipoName"></p>

</div>

</div>



<div class="grid">

<div class="box">

<label>Open Date</label>

<span id="openDate"></span>

</div>

<div class="box">

<label>Close Date</label>

<span id="closeDate"></span>

</div>

<div class="box">

<label>Price Band</label>

<span id="priceBand"></span>

</div>

<div class="box">

<label>Lot Size</label>

<span id="lotSize"></span>

</div>

<div class="box">

<label>Minimum Investment</label>

<span id="minimumInvestment"></span>

</div>

<div class="box">

<label>Listing Date</label>

<span id="listingDate"></span>

</div>

<div class="box">

<label>Exchange</label>

<span id="exchange"></span>

</div>

<div class="box">

<label>GMP</label>

<span id="gmp"></span>

</div>

</div>



<h3>Investment Highlights</h3>

<ul id="highlights">

</ul>



<div class="buttons">

<a id="callBtn">

<i class="fa-solid fa-phone"></i>

Call

</a>

<a id="whatsappBtn" target="_blank">

<i class="fa-brands fa-whatsapp"></i>

WhatsApp

</a>

</div>

</div>

</div>



<div class="container actions">

<button id="downloadBtn">

<i class="fa-solid fa-download"></i>

Download PNG

</button>

<button id="shareBtn">

<i class="fa-brands fa-whatsapp"></i>

Share

</button>

</div>



<footer>

<div class="container">

<h3 id="footerName"></h3>

<p id="footerTagline"></p>

<p id="footerPhone"></p>

<p id="footerEmail"></p>

<p id="lastUpdated"></p>

</div>

</footer>

<script src="script.js"></script>

</body>

</html>
