<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPO Data Entry | Admin Panel</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="admin-container">
    <header class="header" style="border-bottom: 2px solid var(--gold-primary); padding-bottom: 15px; margin-bottom: 25px;">
      <div>
        <h1 style="color: var(--navy-primary); font-size: 1.5rem;">IPO Data Manager</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Fill out the form below to update the live IPO update page instantly.</p>
      </div>
      <a href="output.html" class="admin-btn btn-export" style="text-decoration: none; font-size: 0.85rem;">
        <i class="fa-solid fa-eye"></i> View Live Output
      </a>
    </header>

    <form id="ipoEntryForm">
      
      <div class="form-group">
        <label for="ipoName">IPO Company Name</label>
        <input type="text" id="ipoName" placeholder="e.g., Caliber Mining & Logistics Limited" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="ipoCategory">Category</label>
          <select id="ipoCategory">
            <option value="Mainboard IPO">Mainboard IPO</option>
            <option value="SME IPO">SME IPO</option>
          </select>
        </div>
        <div class="form-group">
          <label for="estListingGain">Est. Listing Gain</label>
          <input type="text" id="estListingGain" placeholder="e.g., +28% to +35%">
        </div>
      </div>

      <div class="form-group">
        <label for="ipoDescription">Brief Description</label>
        <textarea id="ipoDescription" rows="2" placeholder="Short description of company business..."></textarea>
      </div>

      <h4 style="margin: 20px 0 10px; color: var(--navy-primary);"><i class="fa-solid fa-list"></i> Issue Details</h4>

      <div class="grid-2">
        <div class="form-group">
          <label for="biddingDates">Bidding Dates</label>
          <input type="text" id="biddingDates" placeholder="e.g., Jul 28 - Jul 30, 2026">
        </div>
        <div class="form-group">
          <label for="priceBand">Price Band</label>
          <input type="text" id="priceBand" placeholder="e.g., ₹140 - ₹147 / share">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="issueSize">Issue Size</label>
          <input type="text" id="issueSize" placeholder="e.g., ₹450.00 Cr">
        </div>
        <div class="form-group">
          <label for="lotSize">Lot Size</label>
          <input type="text" id="lotSize" placeholder="e.g., 100 Shares (₹14,700)">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="listingOn">Listing On</label>
          <input type="text" id="listingOn" placeholder="e.g., BSE & NSE">
        </div>
        <div class="form-group">
          <label for="expectedListing">Expected Listing Date</label>
          <input type="text" id="expectedListing" placeholder="e.g., Aug 04, 2026">
        </div>
      </div>

      <div class="form-group">
        <label for="retailQuota">Retail Quota</label>
        <input type="text" id="retailQuota" placeholder="e.g., 35%">
      </div>

      <div class="form-group">
        <label for="highlights">Investment Highlights (One per line)</label>
        <textarea id="highlights" rows="4" placeholder="Enter key point 1&#10;Enter key point 2&#10;Enter key point 3"></textarea>
      </div>

      <div class="btn-group">
        <button type="submit" class="admin-btn btn-save"><i class="fa-solid fa-floppy-disk"></i> Save & Publish to Output</button>
        <button type="button" id="resetBtn" class="admin-btn btn-reset"><i class="fa-solid fa-rotate-left"></i> Reset to Default</button>
      </div>

    </form>
  </div>

  <script src="script.js"></script>
  <script>
    // Form specific load/save triggers
    document.addEventListener("DOMContentLoaded", () => {
      loadFormValues();

      document.getElementById("ipoEntryForm").addEventListener("submit", (e) => {
        e.preventDefault();
        saveFormValues();
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        if (confirm("Reset to default sample IPO data?")) {
          localStorage.removeItem("CUSTOM_IPO_DATA");
          alert("Reset complete! Redirecting to output page...");
          window.location.href = "output.html";
        }
      });
    });

    function loadFormValues() {
      const saved = localStorage.getItem("CUSTOM_IPO_DATA");
      const data = saved ? JSON.parse(saved) : DEFAULT_IPO;

      document.getElementById("ipoName").value = data.name || "";
      document.getElementById("ipoCategory").value = data.category || "Mainboard IPO";
      document.getElementById("ipoDescription").value = data.description || "";
      
      const getVal = (label) => {
        const item = data.details.find(d => d.label === label);
        return item ? item.value : "";
      };

      document.getElementById("biddingDates").value = getVal("Bidding Dates");
      document.getElementById("priceBand").value = getVal("Price Band");
      document.getElementById("issueSize").value = getVal("Issue Size");
      document.getElementById("lotSize").value = getVal("Lot Size");
      document.getElementById("listingOn").value = getVal("Listing On");
      document.getElementById("expectedListing").value = getVal("Expected Listing");
      document.getElementById("retailQuota").value = getVal("Retail Quota");
      document.getElementById("estListingGain").value = getVal("Est. Listing Gain");
      
      document.getElementById("highlights").value = (data.highlights || []).join("\n");
    }

    function saveFormValues() {
      const highlightsText = document.getElementById("highlights").value;
      const highlightsArray = highlightsText.split("\n").filter(line => line.trim() !== "");

      const updatedIpo = {
        name: document.getElementById("ipoName").value,
        category: document.getElementById("ipoCategory").value,
        description: document.getElementById("ipoDescription").value,
        details: [
          { label: "Bidding Dates", value: document.getElementById("biddingDates").value },
          { label: "Price Band", value: document.getElementById("priceBand").value },
          { label: "Issue Size", value: document.getElementById("issueSize").value },
          { label: "Lot Size", value: document.getElementById("lotSize").value },
          { label: "Listing On", value: document.getElementById("listingOn").value },
          { label: "Expected Listing", value: document.getElementById("expectedListing").value },
          { label: "Retail Quota", value: document.getElementById("retailQuota").value },
          { label: "Est. Listing Gain", value: document.getElementById("estListingGain").value, isHighlight: true }
        ],
        highlights: highlightsArray
      };

      localStorage.setItem("CUSTOM_IPO_DATA", JSON.stringify(updatedIpo));
      alert("IPO details saved successfully!");
      window.location.href = "output.html";
    }
  </script>
</body>
</html>
